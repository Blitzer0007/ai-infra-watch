# pytest config.
#
# - stub LLM mode by default (CI-safe; no API keys needed for the suite)
# - deterministic ordering
[pytest]
testpaths = tests
addopts = -q
# When no provider is selected, run the LLM suite in stub mode so CI
# never accidentally spends money. Override per-run with:
#   LLM_PROVIDER=anthropic pytest tests/llm -m live
markers =
    live: requires a real LLM API key (skipped in stub mode)
