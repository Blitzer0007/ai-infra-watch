name: Temporary dependency lockfile remediation

on:
  push:
    branches:
      - security/dependency-audit-remediation

permissions:
  contents: write

jobs:
  remediate:
    name: Patch npm lockfile without executing install scripts
    if: github.repository == 'Blitzer0007/ai-infra-watch' && github.ref == 'refs/heads/security/dependency-audit-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the remediation branch
        uses: actions/checkout@v4
        with:
          ref: security/dependency-audit-remediation
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Apply lockfile-only security updates
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund --no-progress

      - name: Require zero known npm advisories
        shell: bash
        run: |
          set +e
          npm audit --json > "$RUNNER_TEMP/npm-audit-after.json"
          audit_status=$?
          set -e
          node --input-type=module - "$RUNNER_TEMP/npm-audit-after.json" "$audit_status" <<'NODE'
          import { readFileSync } from 'node:fs';
          const [file, statusText] = process.argv.slice(2);
          const report = JSON.parse(readFileSync(file, 'utf8'));
          const summary = report.metadata?.vulnerabilities || {};
          console.log('Post-fix npm audit:', JSON.stringify(summary));
          if (Number(statusText) !== 0 || Number(summary.total || 0) !== 0) {
            process.exitCode = 1;
            console.error('Dependency remediation incomplete; no changes were committed.');
          }
          NODE

      - name: Commit the patched lockfile and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/dependency-lockfile-automation.yml
          if git diff --cached --quiet; then
            echo "No remediation changes to commit."
            exit 1
          fi
          git commit -m "fix: patch vulnerable npm dependencies"
          git push origin HEAD:security/dependency-audit-remediation
