name: UI API DB Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "api/**"
      - "qa/**"
      - ".github/workflows/qa-validation.yml"
  schedule:
    - cron: "30 2 * * *"

jobs:
  api:
    name: API contract validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QA dependencies
        run: python -m pip install -r qa/requirements.txt
      - name: Run API validation
        env:
          QA_BASE_URL: ${{ vars.QA_BASE_URL }}
          QA_HEADERS_JSON: ${{ secrets.QA_HEADERS_JSON }}
        run: python -m pytest -q qa/test_api.py

  db:
    name: Database validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QA dependencies
        run: python -m pip install -r qa/requirements.txt
      - name: Run DB validation
        env:
          QA_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          QA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m pytest -q qa/test_db.py

  ui:
    name: Playwright UI functional validation
    runs-on: ubuntu-latest
    if: ${{ vars.QA_BASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QA dependencies
        run: python -m pip install -r qa/requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run Playwright UI tests
        env:
          QA_BASE_URL: ${{ vars.QA_BASE_URL }}
          QA_HEADERS_JSON: ${{ secrets.QA_HEADERS_JSON }}
          QA_STORAGE_STATE_B64: ${{ secrets.QA_STORAGE_STATE_B64 }}
        run: python -m pytest -q qa/test_ui.py
