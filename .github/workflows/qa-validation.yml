name: UI API DB Validation

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "api/**"
      - "server/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - "qa/**"
      - ".github/workflows/qa-validation.yml"
      - ".github/workflows/vercel-production-deploy.yml"
      - ".github/workflows/reentry-alerts.yml"
      - ".github/workflows/security-audit.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "server/**"
      - "supabase/**"
      - "src/**"
      - "api/**"
      - "package.json"
      - "package-lock.json"
      - "qa/**"
      - ".github/workflows/qa-validation.yml"
      - ".github/workflows/vercel-production-deploy.yml"
      - ".github/workflows/jev-lab-weekly-review.yml"
      - ".github/workflows/reentry-alerts.yml"
      - ".github/workflows/security-audit.yml"
  schedule:
    - cron: "30 2 * * *"

jobs:
  ui-local:
    name: Playwright UI functional validation (local mocked APIs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QA dependencies
        run: python -m pip install -r qa/requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Start local app
        env:
          GEMINI_API_KEY: qa-local-placeholder
          VITE_QA_MODE: "true"
        run: |
          nohup npm run dev -- --host 127.0.0.1 > /tmp/aiw-local.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0; sleep 2; done
          cat /tmp/aiw-local.log
          exit 1
      - name: Run local Playwright tests
        env:
          QA_BASE_URL: http://127.0.0.1:3000
          QA_UI_MOCKS: "true"
        run: python -m pytest -q qa/test_ui.py qa/test_ui_exploratory.py

  api:
    name: API contract validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QA dependencies
        run: python -m pip install -r qa/requirements.txt
      - name: Run API validation
        env:
          QA_BASE_URL: ${{ vars.QA_BASE_URL }}
          QA_HEADERS_JSON: ${{ secrets.QA_HEADERS_JSON }}
        run: python -m pytest -q qa/test_api.py

  db:
    name: Database validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QA dependencies
        run: python -m pip install -r qa/requirements.txt
      - name: Run DB validation
        env:
          QA_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          QA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m pytest -q qa/test_db.py

  ui:
    name: Playwright UI functional validation
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && vars.QA_BASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QA dependencies
        run: python -m pip install -r qa/requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run Playwright UI tests
        env:
          QA_BASE_URL: ${{ vars.QA_BASE_URL }}
          QA_HEADERS_JSON: ${{ secrets.QA_HEADERS_JSON }}
          QA_STORAGE_STATE_B64: ${{ secrets.QA_STORAGE_STATE_B64 }}
        run: python -m pytest -q qa/test_ui.py qa/test_ui_exploratory.py


  jev-production-smoke:
    name: Authenticated production JEV smoke (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QA dependencies
        run: python -m pip install -r qa/requirements.txt
      - name: Require authenticated production QA configuration
        shell: bash
        env:
          QA_BASE_URL: ${{ vars.QA_BASE_URL }}
          QA_HEADERS_JSON: ${{ secrets.QA_HEADERS_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${QA_BASE_URL:-}" ]; then
            echo "::error::QA_BASE_URL is required; the production JEV smoke must run, not be skipped."
            exit 1
          fi
          if [ -z "${QA_HEADERS_JSON:-}" ]; then
            echo "::error::QA_HEADERS_JSON is required; skipped authenticated smoke tests are not release evidence."
            exit 1
          fi
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run isolated authenticated JEV smoke tests
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
          QA_BASE_URL: ${{ vars.QA_BASE_URL }}
          QA_HEADERS_JSON: ${{ secrets.QA_HEADERS_JSON }}
          QA_STORAGE_STATE_B64: ${{ secrets.QA_STORAGE_STATE_B64 }}
        run: python -u -m pytest -vv -s -o faulthandler_timeout=120 qa/test_jev_production.py

  telegram-outbox-migration-test:
    name: Telegram outbox migration integration test (disposable PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          # Trust authentication is restricted to this ephemeral CI-only database.
          # Do not reuse this setting for a persistent or production database.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create disposable roles used by Supabase grants
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres \
            -c "CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role;"
      - name: Apply re-entry schema and outbox migrations to disposable PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres \
            -f supabase/migrations/20261014_reentry_watchlist.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres \
            -f supabase/migrations/20261015070000_reentry_dual_path_research_fields.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres \
            -f supabase/migrations/20261015060000_reentry_telegram_delivery_outbox.sql
      - name: Verify grants, claims, acceptance, and uncertain message IDs
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres \
            -f supabase/tests/reentry_telegram_delivery_outbox.sql
