name: Portfolio Digest Fallback Scheduler
run-name: Portfolio Digest Fallback • ${{ github.event.schedule || 'manual' }}

on:
  schedule:
    # Ten minutes after each primary schedule. Digest idempotency prevents duplicate delivery.
    # Separate entries preserve the intended local slot when GitHub starts late.
    - cron: '45 0 * * *'
    - cron: '45 6 * * *'
    - cron: '45 12 * * *'
    - cron: '45 16 * * *'
  workflow_dispatch:

concurrency:
  group: portfolio-digest-fallback-scheduler
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  send-digest:
    name: Send fallback portfolio digest
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::GitHub OIDC token endpoint is unavailable."
            exit 1
          fi
          OIDC_RESPONSE=$(curl --fail-with-body --silent --show-error \
            --get \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=ai-infra-watch" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")
          OIDC_TOKEN=$(printf '%s' "$OIDC_RESPONSE" | node -e "let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>process.stdout.write(JSON.parse(d).value||''));")
          if [ -z "$OIDC_TOKEN" ]; then
            echo "::error::GitHub OIDC token response did not contain a token."
            exit 1
          fi
          echo "::add-mask::$OIDC_TOKEN"
          echo "token=$OIDC_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run portfolio digest fallback
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          FALLBACK_TOKEN: ${{ secrets.AIW_CRON_SECRET }}
        run: |
          set -euo pipefail
          SCHEDULE="${{ github.event.schedule || '' }}"
          case "$SCHEDULE" in
            *" 0 "*) EXPECTED_HOUR=6 ;;
            *" 6 "*) EXPECTED_HOUR=12 ;;
            *" 12 "*) EXPECTED_HOUR=18 ;;
            *" 16 "*) EXPECTED_HOUR=22 ;;
            *) EXPECTED_HOUR=$(TZ=Asia/Kolkata date '+%H') ;;
          esac
          NOW_DATE=$(TZ=Asia/Kolkata date '+%Y-%m-%d')
          NOW_HOUR=$(TZ=Asia/Kolkata date '+%H')
          if (( 10#$NOW_HOUR < EXPECTED_HOUR )); then
            SLOT_DATE=$(TZ=Asia/Kolkata date -d 'yesterday' '+%Y-%m-%d')
          else
            SLOT_DATE="$NOW_DATE"
          fi
          SLOT="$SLOT_DATE-$(printf '%02d' "$EXPECTED_HOUR")"
          echo "Intended digest slot: $SLOT (actual execution: $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S %Z'))"
          RESPONSE=$(curl --silent --show-error \
            --request GET \
            --header "Authorization: Bearer $OIDC_TOKEN" \
            --header "User-Agent: ai-infra-watch-github-actions-fallback/4.0" \
            --write-out '\n%{http_code}' \
            --retry 3 --retry-all-errors --retry-delay 3 \
            "https://ai-infra-watch-theta.vercel.app/api/portfolio-digest?slot=$SLOT")
          STATUS=$(printf '%s' "$RESPONSE" | tail -n1)
          BODY=$(printf '%s' "$RESPONSE" | sed '$d')
          if [ "$STATUS" = "200" ]; then
            printf '%s\n' "$BODY"
            exit 0
          fi
          echo "::warning::OIDC digest request returned HTTP $STATUS."
          if [ -z "${FALLBACK_TOKEN:-}" ]; then
            printf '%s\n' "$BODY"
            exit 1
          fi
          echo "Retrying digest with the server scheduler credential."
          curl --fail-with-body --silent --show-error \
            --request GET \
            --header "Authorization: Bearer $FALLBACK_TOKEN" \
            --header "User-Agent: ai-infra-watch-github-actions-secret-fallback/1.0" \
            --retry 3 --retry-all-errors --retry-delay 3 \
            "https://ai-infra-watch-theta.vercel.app/api/portfolio-digest?slot=$SLOT"

      - name: Record completion
        run: echo "Portfolio digest fallback completed at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
