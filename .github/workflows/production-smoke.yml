name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check autonomous agent health route
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 35 "https://ai-infra-watch-theta.vercel.app/api/agent-ask?probe_mcp=true" -o /tmp/agent-health.json
          python - <<'PY'
          import json

          with open("/tmp/agent-health.json", encoding="utf-8") as f:
              body = json.load(f)

          if body.get("status") not in {"ok", "degraded"}:
              raise SystemExit(f"unexpected autonomous health response: {body}")
          if body.get("mcp_probe") and body.get("mcp_ready") is not True:
              raise SystemExit(f"MCP readiness probe failed: {body}")

          print("autonomous agent health check passed")
          print("provider:", body.get("provider"))
          print("mcp connected:", (body.get("mcp") or {}).get("connected"))
          PY

      - name: Check production live-data endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 25 "https://ai-infra-watch-theta.vercel.app/api/live-data?refresh=true" -o /tmp/live-data.json
          python - <<'PY'
          import json

          with open("/tmp/live-data.json", encoding="utf-8") as f:
              body = json.load(f)

          required = ("stockPrices", "news", "contracts", "macroRisks", "politicalSignals", "sources", "timestamp")
          missing = [key for key in required if key not in body]
          if missing:
              raise SystemExit(f"missing production live-data keys: {missing}")

          for key, expected_type in {
              "stockPrices": dict,
              "news": list,
              "contracts": list,
              "macroRisks": list,
              "politicalSignals": list,
          }.items():
              if not isinstance(body[key], expected_type):
                  raise SystemExit(f"{key} must be a {expected_type.__name__}")

          build = body.get("build") or {}
          print("production live-data smoke check passed")
          print("environment:", build.get("environment"))
          print("commit:", build.get("commit"))
          print("quotes:", len(body["stockPrices"]))
          print("news:", len(body["news"]))
          print("contracts:", len(body["contracts"]))
          print("political signals:", len(body["politicalSignals"]))
          PY

      - name: Check consolidated earnings history endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 35 "https://ai-infra-watch-theta.vercel.app/api/earnings-alerts?history=1&symbols=NVDA&limit=2" -o /tmp/earnings-history.json
          python - <<'PY'
          import json

          with open("/tmp/earnings-history.json", encoding="utf-8") as f:
              body = json.load(f)

          if "historical" not in body or not isinstance(body["historical"], dict):
              raise SystemExit(f"invalid earnings history response: {body}")
          if body.get("ok") is not True:
              raise SystemExit(f"earnings history endpoint unavailable: {body}")
          if "NVDA" not in body["historical"]:
              raise SystemExit(f"NVDA history missing from response: {body}")

          print("consolidated earnings history smoke check passed")
          print("NVDA rows:", len(body["historical"]["NVDA"]))
          PY

      - name: Run manual autonomous research smoke
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 70             -H "Content-Type: application/json"             -X POST             "https://ai-infra-watch-theta.vercel.app/api/agent-ask"             --data "$(python -c 'import json, os; print(json.dumps({"question": os.environ["QUESTION"]}))')"             -o /tmp/autonomous-smoke.json
          python - <<'PY'
          import json

          with open("/tmp/autonomous-smoke.json", encoding="utf-8") as f:
              body = json.load(f)

          if body.get("mode") != "autonomous-mcp":
              raise SystemExit(f"unexpected autonomous mode: {body}")

          calls = body.get("calls") or []
          trajectory = body.get("trajectory") or []
          if not calls:
              raise SystemExit(f"autonomous smoke returned no evidence calls: {body}")
          if not trajectory:
              raise SystemExit(f"autonomous smoke returned no trajectory: {body}")

          allowed_resolutions = {
              "completed",
              "jev_evidence_sufficient",
              "jev_evidence_insufficient",
              "max_steps",
          }
          resolution = body.get("resolution")
          if resolution not in allowed_resolutions:
              raise SystemExit(f"unexpected autonomous resolution: {resolution}")

          successful_tools = [
              str(item.get("tool"))
              for item in calls
              if item.get("ok")
          ]
          if not successful_tools:
              raise SystemExit(f"autonomous smoke returned no successful evidence tool calls: {body}")

          server_names = {
              name.split(".", 1)[0]
              for name in successful_tools
              if "." in name
          }
          if len(server_names) < 2:
              raise SystemExit(
                  "autonomous smoke did not use complementary evidence servers: "
                  + ", ".join(successful_tools)
              )

          print("autonomous research smoke check passed")
          print("resolution:", resolution)
          print("answer source:", body.get("answer_source"))
          print("successful tools:", successful_tools)
          print("evidence servers:", sorted(server_names))
          print("trajectory nodes:", [item.get("node") for item in trajectory])
          PY
        env:
          QUESTION: What recent developments could affect NVIDIA's stock price? Check news, SEC/filings, and historical market data, and distinguish confirmed facts from hypotheses.
