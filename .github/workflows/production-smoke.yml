name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check autonomous agent health route
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20             "https://ai-infra-watch.vercel.app/api/agent-ask"             -o /tmp/agent-health.json
          python - <<'PY'
          import json

          with open("/tmp/agent-health.json", encoding="utf-8") as f:
              body = json.load(f)

          if body.get("status") != "ok":
              raise SystemExit(f"unexpected autonomous health response: {body}")

          print("autonomous agent health check passed")
          print("provider:", body.get("provider"))
          print("mcp connected:", (body.get("mcp") or {}).get("connected"))
          PY

      - name: Check production live-data endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 25             "https://ai-infra-watch.vercel.app/api/live-data?refresh=true"             -o /tmp/live-data.json
          python - <<'PY'
          import json

          with open("/tmp/live-data.json", encoding="utf-8") as f:
              body = json.load(f)

          required = ("stockPrices", "news", "contracts", "macroRisks", "sources", "timestamp")
          missing = [key for key in required if key not in body]
          if missing:
              raise SystemExit(f"missing production live-data keys: {missing}")

          if not isinstance(body["stockPrices"], dict):
              raise SystemExit("stockPrices must be an object")
          if not isinstance(body["news"], list):
              raise SystemExit("news must be a list")
          if not isinstance(body["contracts"], list):
              raise SystemExit("contracts must be a list")

          build = body.get("build") or {}
          print("production live-data smoke check passed")
          print("environment:", build.get("environment"))
          print("commit:", build.get("commit"))
          print("quotes:", len(body["stockPrices"]))
          print("news:", len(body["news"]))
          print("contracts:", len(body["contracts"]))
          PY
