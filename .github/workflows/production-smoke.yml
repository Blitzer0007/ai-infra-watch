name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check production access gate
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 20 -o /tmp/auth.json -w '%{http_code}' \
            -H "Content-Type: application/json" \
            -X POST \
            "https://ai-infra-watch-theta.vercel.app/api/auth" \
            --data '{"token":""}')"
          printf '%s' "$status" > /tmp/auth-status.txt
          python - <<'PY'
          import json

          with open("/tmp/auth-status.txt", encoding="utf-8") as f:
              status = f.read().strip()
          with open("/tmp/auth.json", encoding="utf-8") as f:
              body = json.load(f)

          if status != "401":
              raise SystemExit(f"expected unauthenticated access gate to return 401, got {status}: {body}")

          print("production access gate is active")
          PY

      - name: Check production live-data endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 25 "https://ai-infra-watch-theta.vercel.app/api/live-data?refresh=true" -o /tmp/live-data.json
          python - <<'PY'
          import json

          with open("/tmp/live-data.json", encoding="utf-8") as f:
              body = json.load(f)

          required = ("stockPrices", "news", "contracts", "macroRisks", "politicalSignals", "sources", "timestamp")
          missing = [key for key in required if key not in body]
          if missing:
              raise SystemExit(f"missing production live-data keys: {missing}")

          for key, expected_type in {
              "stockPrices": dict,
              "news": list,
              "contracts": list,
              "macroRisks": list,
              "politicalSignals": list,
          }.items():
              if not isinstance(body[key], expected_type):
                  raise SystemExit(f"{key} must be a {expected_type.__name__}")

          build = body.get("build") or {}
          print("production live-data smoke check passed")
          print("environment:", build.get("environment"))
          print("commit:", build.get("commit"))
          print("quotes:", len(body["stockPrices"]))
          print("news:", len(body["news"]))
          print("contracts:", len(body["contracts"]))
          print("political signals:", len(body["politicalSignals"]))
          PY

      - name: Check VIVO historical market data
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 25 "https://ai-infra-watch-theta.vercel.app/api/company-scale?action=history&symbol=VIVO&range=1y" -o /tmp/vivo-history.json
          python - <<'PY'
          import json

          with open("/tmp/vivo-history.json", encoding="utf-8") as f:
              body = json.load(f)

          if body.get("symbol") != "VIVO":
              raise SystemExit(f"unexpected VIVO history symbol: {body}")
          if not isinstance(body.get("points"), list) or len(body["points"]) < 2:
              raise SystemExit(f"VIVO historical data unavailable or too short: {body}")
          if body.get("stale") is True:
              raise SystemExit(f"VIVO history unexpectedly fell back to stale data: {body}")

          print("VIVO historical market data smoke check passed")
          print("provider:", body.get("provider"))
          print("points:", len(body["points"]))

      - name: Check consolidated earnings history endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 35 "https://ai-infra-watch-theta.vercel.app/api/earnings-alerts?history=1&symbols=NVDA&limit=2" -o /tmp/earnings-history.json
          python - <<'PY'
          import json

          with open("/tmp/earnings-history.json", encoding="utf-8") as f:
              body = json.load(f)

          if "historical" not in body or not isinstance(body["historical"], dict):
              raise SystemExit(f"invalid earnings history response: {body}")
          if body.get("ok") is not True:
              raise SystemExit(f"earnings history endpoint unavailable: {body}")
          if "NVDA" not in body["historical"]:
              raise SystemExit(f"NVDA history missing from response: {body}")

          print("consolidated earnings history smoke check passed")
          print("NVDA rows:", len(body["historical"]["NVDA"]))
          PY

      - name: Check protected portfolio API rejects anonymous access
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 20 -o /tmp/portfolio-auth.json -w '%{http_code}' \
            "https://ai-infra-watch-theta.vercel.app/api/portfolio")"
          printf '%s' "$status" > /tmp/portfolio-status.txt
          python - <<'PY'
          with open("/tmp/portfolio-status.txt", encoding="utf-8") as f:
              status = f.read().strip()

          if status != "401":
              raise SystemExit(f"expected protected portfolio API to return 401, got {status}")

          print("protected portfolio API correctly rejects anonymous access")
          PY

      - name: Production smoke summary
        run: |
          echo "Production smoke checks passed."
          echo "Autonomous research remains protected by the private access token and is validated separately by CI agent tests and the authenticated dashboard smoke."
