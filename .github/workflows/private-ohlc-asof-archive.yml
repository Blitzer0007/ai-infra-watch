name: Private OHLC as-of archive

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 1-5"

permissions:
  contents: read

concurrency:
  group: private-historical-evidence-archive
  cancel-in-progress: false

jobs:
  archive:
    name: Archive daily OHLC as-of snapshots
    if: ${{ vars.HISTORICAL_EVIDENCE_ARCHIVE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout controlled source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/historical_evidence/requirements.txt

      - name: Install lightweight archival dependencies
        run: python -m pip install -r scripts/historical_evidence/requirements.txt

      - name: Archive the seven documented Free-plan symbols privately
        env:
          OHLC_API_KEY: ${{ secrets.OHLC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m scripts.historical_evidence.archive_ohlc_asof
