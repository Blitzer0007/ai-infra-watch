name: Vercel Production Deploy
run-name: Vercel Production Deploy • ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy latest main to Vercel
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy]'))
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_TfbzU4SMDZD8lIgCHKsJNa6v
      VERCEL_PROJECT_ID: prj_5G5PtOgnVCxyPjTqXII4oXPrS4XD
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify Vercel token
        shell: bash
        run: |
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::error::VERCEL_TOKEN is not available to this workflow."
            echo "Add it under GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Vercel token is available."

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Set up Python for Vercel local build
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv for Vercel Python build
        run: python -m pip install --upgrade pip uv

      - name: Verify Vercel authentication
        run: vercel whoami --token="${VERCEL_TOKEN}" --debug

      - name: Pull Vercel production configuration
        run: vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"

      - name: Build Vercel deployment
        run: vercel build --prod --token="${VERCEL_TOKEN}"

      - name: Deploy to Vercel production
        run: vercel deploy --prebuilt --archive=tgz --prod --token="${VERCEL_TOKEN}"

      - name: Smoke-test production release
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://ai-infra-watch-theta.vercel.app"

          curl --fail --silent --show-error --max-time 20 "$BASE_URL/" -o /tmp/production-home.html

          auth_status="$(curl --silent --show-error --max-time 20 -o /tmp/production-auth.json -w '%{http_code}' \
            -H "Content-Type: application/json" -X POST "$BASE_URL/api/auth" --data '{"token":""}')"
          if [ "$auth_status" != "401" ]; then
            echo "::error::Expected anonymous auth check to return 401, got $auth_status"
            cat /tmp/production-auth.json
            exit 1
          fi

          portfolio_status="$(curl --silent --show-error --max-time 20 -o /tmp/production-portfolio.json -w '%{http_code}' \
            "$BASE_URL/api/portfolio")"
          if [ "$portfolio_status" != "401" ]; then
            echo "::error::Expected protected portfolio API to return 401, got $portfolio_status"
            cat /tmp/production-portfolio.json
            exit 1
          fi

          curl --fail --silent --show-error --max-time 35 \
            "$BASE_URL/api/company-scale?action=peer-fundamentals&symbols=NVDA%2CAMD" \
            -o /tmp/production-peer-fundamentals.json

          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          body = json.loads(Path("/tmp/production-peer-fundamentals.json").read_text(encoding="utf-8"))
          if body.get("source") != "SEC EDGAR companyfacts":
              raise SystemExit(f"unexpected peer fundamentals source: {body.get('source')!r}")
          rows = body.get("results")
          if not isinstance(rows, list):
              raise SystemExit("peer fundamentals results must be an array")
          by_symbol = {row.get("symbol"): row for row in rows if isinstance(row, dict)}
          for symbol in ("NVDA", "AMD"):
              row = by_symbol.get(symbol)
              if not row:
                  raise SystemExit(f"missing requested symbol {symbol}")
              if not isinstance(row.get("metrics"), dict):
                  raise SystemExit(f"{symbol} metrics must be an object")
              if row.get("status") not in {"partial", "insufficient-evidence", "unavailable", "not-found"}:
                  raise SystemExit(f"unexpected {symbol} evidence status: {row.get('status')!r}")
          nvda_size = by_symbol["NVDA"]["metrics"].get("size")
          if not nvda_size:
              raise SystemExit("NVDA must expose a sourced annual revenue size proxy")
          observed = datetime.fromisoformat(nvda_size["observedAt"].replace("Z", "+00:00"))
          age = datetime.now(timezone.utc) - observed
          if observed.tzinfo is None or age < timedelta(0) or age > timedelta(days=550):
              raise SystemExit(f"NVDA annual revenue evidence is stale or invalid: {nvda_size['observedAt']}")
          print("Production post-deploy smoke passed: homepage, access gates, and fresh SEC peer fundamentals contract.")
          PY
