name: Vercel Production Deploy
run-name: Vercel Production Deploy • ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Deploy production now'
    name: Deploy latest main to Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_Ws1BysoBDemarhql3G252EqG
      VERCEL_PROJECT_ID: prj_5TIo61X4jiqprrwzFU9JxWA87Yj4
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify Vercel token
        shell: bash
        run: |
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::error::VERCEL_TOKEN is not available to this workflow."
            echo "Add it under GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Vercel token is available."

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Set up Python for Vercel local build
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv for Vercel Python build
        run: python -m pip install --upgrade pip uv

      - name: Verify Vercel authentication
        run: vercel whoami --token="${VERCEL_TOKEN}" --debug

      - name: Pull Vercel production configuration
        run: vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"

      - name: Build Vercel deployment
        run: vercel build --prod --token="${VERCEL_TOKEN}"

      - name: Deploy to Vercel production
        run: vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}"
