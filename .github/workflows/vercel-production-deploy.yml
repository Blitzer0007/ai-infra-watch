name: Vercel Production Deploy
run-name: Vercel Production Deploy • ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Explicitly approve deploying the current main branch to production"
        type: choice
        options:
          - "NO"
          - "YES"
        required: true
        default: "NO"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy latest main to Vercel
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_production_deploy == 'YES'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_TfbzU4SMDZD8lIgCHKsJNa6v
      VERCEL_PROJECT_ID: prj_5G5PtOgnVCxyPjTqXII4oXPrS4XD

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify Vercel token is configured
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::error::VERCEL_TOKEN is not available to this workflow."
            echo "Add it under GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Vercel token is available."

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Set up Python for Vercel local build
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv for Vercel Python build
        run: python -m pip install --upgrade pip uv

      - name: Verify Vercel authentication
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel whoami

      - name: Pull Vercel production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production

      - name: Build Vercel deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod

      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --archive=tgz --prod

      - name: Smoke-test production release
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://ai-infra-watch-theta.vercel.app"

          curl --fail --silent --show-error --max-time 20 "$BASE_URL/" -o /tmp/production-home.html

          auth_status="$(curl --silent --show-error --max-time 20 -o /tmp/production-auth.json -w '%{http_code}' \
            -H "Content-Type: application/json" -X POST "$BASE_URL/api/auth" --data '{"token":""}')"
          if [ "$auth_status" != "401" ]; then
            echo "::error::Expected anonymous auth check to return 401, got $auth_status"
            exit 1
          fi

          portfolio_status="$(curl --silent --show-error --max-time 20 -o /tmp/production-portfolio.json -w '%{http_code}' \
            "$BASE_URL/api/portfolio")"
          if [ "$portfolio_status" != "401" ]; then
            echo "::error::Expected protected portfolio API to return 401, got $portfolio_status"
            exit 1
          fi

          curl --fail --silent --show-error --max-time 35 \
            "$BASE_URL/api/company-scale?action=peer-fundamentals&symbols=NVDA%2CAMD" \
            -o /tmp/production-peer-fundamentals.json

          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          body = json.loads(Path("/tmp/production-peer-fundamentals.json").read_text(encoding="utf-8"))
          if body.get("source") != "SEC EDGAR companyfacts":
              raise SystemExit(f"unexpected peer fundamentals source: {body.get('source')!r}")
          rows = body.get("results")
          if not isinstance(rows, list):
              raise SystemExit("peer fundamentals results must be an array")
          by_symbol = {row.get("symbol"): row for row in rows if isinstance(row, dict)}
          for symbol in ("NVDA", "AMD"):
              row = by_symbol.get(symbol)
              if not row:
                  raise SystemExit(f"missing requested symbol {symbol}")
              if not isinstance(row.get("metrics"), dict):
                  raise SystemExit(f"{symbol} metrics must be an object")
              if row.get("status") not in {"partial", "insufficient-evidence", "unavailable", "not-found"}:
                  raise SystemExit(f"unexpected {symbol} evidence status: {row.get('status')!r}")
          nvda_size = by_symbol["NVDA"]["metrics"].get("size")
          if not nvda_size:
              raise SystemExit("NVDA must expose a sourced annual revenue size proxy")
          observed = datetime.fromisoformat(nvda_size["observedAt"].replace("Z", "+00:00"))
          age = datetime.now(timezone.utc) - observed
          if observed.tzinfo is None or age < timedelta(0) or age > timedelta(days=550):
              raise SystemExit(f"NVDA annual revenue evidence is stale or invalid: {nvda_size['observedAt']}")
          print("Production post-deploy smoke passed: homepage, access gates, and fresh SEC peer fundamentals contract.")
          PY

      - name: Verify Data Health, scheduler, and Re-entry delivery ledger
        shell: bash
        env:
          QA_HEADERS_JSON: ${{ secrets.QA_HEADERS_JSON }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          BASE_URL = "https://ai-infra-watch-theta.vercel.app"
          raw_headers = os.environ.get("QA_HEADERS_JSON", "").strip()
          if not raw_headers:
              raise SystemExit("QA_HEADERS_JSON is required for authenticated post-deploy health checks.")

          try:
              headers = json.loads(raw_headers)
          except json.JSONDecodeError as exc:
              raise SystemExit("QA_HEADERS_JSON must contain a JSON object.") from exc
          if not isinstance(headers, dict):
              raise SystemExit("QA_HEADERS_JSON must contain a JSON object.")
          headers = {str(key): str(value) for key, value in headers.items()}
          authorization = next((value for key, value in headers.items() if key.lower() == "authorization"), "")
          if not authorization.lower().startswith("bearer ") or not authorization[7:].strip():
              raise SystemExit("QA_HEADERS_JSON must include the existing Authorization: Bearer token header.")

          def get_json(path):
              request_headers = {"Accept": "application/json", "User-Agent": "aiw-post-deploy-health/1.0", **headers}
              request = Request(BASE_URL + path, headers=request_headers, method="GET")
              try:
                  with urlopen(request, timeout=60) as response:
                      status = response.status
                      payload = json.loads(response.read().decode("utf-8"))
              except HTTPError as exc:
                  raise SystemExit(f"Authenticated post-deploy GET {path} returned HTTP {exc.code}.") from None
              except (URLError, TimeoutError) as exc:
                  raise SystemExit(f"Authenticated post-deploy GET {path} failed: {type(exc).__name__}.") from None
              except (UnicodeDecodeError, json.JSONDecodeError):
                  raise SystemExit(f"Authenticated post-deploy GET {path} did not return valid JSON.") from None
              if status != 200 or not isinstance(payload, dict):
                  raise SystemExit(f"Authenticated post-deploy GET {path} returned an unexpected response.")
              return payload

          market = get_json("/api/market?route=market-data-health&refresh=true")
          if market.get("ok") is not True or not isinstance(market.get("rows"), list) or not market["rows"]:
              raise SystemExit("Data Health endpoint did not return a non-empty market diagnostics payload.")
          for row in market["rows"]:
              if not isinstance(row, dict) or not row.get("symbol"):
                  raise SystemExit("Data Health returned a row without a symbol.")
              if not isinstance(row.get("quote"), dict) or not isinstance(row.get("history"), dict):
                  raise SystemExit(f"Data Health diagnostics are incomplete for {row.get('symbol', 'unknown')}.")
          print(f"Data Health endpoint: PASS; {len(market['rows'])} symbol(s) sampled.")
          for row in market["rows"]:
              quote = row["quote"]
              history = row["history"]
              print(
                  "  "
                  + str(row["symbol"])
                  + ": quote=" + str(quote.get("providerStatus") or quote.get("errorCode") or "unknown")
                  + ", history=" + str(history.get("providerStatus") or history.get("errorCode") or "unknown")
                  + ", adjusted_coverage=" + str(history.get("adjustedCoveragePct", "n/a")) + "%"
                  + ", adjusted_complete=" + str(history.get("adjustedCloseAvailable", False))
              )

          health = get_json("/api/job-health")
          if health.get("ok") is not True or not isinstance(health.get("jobs"), list):
              raise SystemExit("Scheduler health endpoint did not return its jobs inventory.")
          jobs = {job.get("id"): job for job in health["jobs"] if isinstance(job, dict)}
          scheduler = jobs.get("server-smart-alerts")
          if not scheduler:
              raise SystemExit("Scheduler health did not include server-smart-alerts.")
          last_success = scheduler.get("lastSuccessAt")
          if not last_success:
              raise SystemExit("No successful Server Smart Alerts scheduler run is recorded.")
          try:
              last_success_time = datetime.fromisoformat(str(last_success).replace("Z", "+00:00"))
              age_minutes = (datetime.now(timezone.utc) - last_success_time).total_seconds() / 60
          except (TypeError, ValueError):
              raise SystemExit("Server Smart Alerts lastSuccessAt is not a valid timestamp.") from None
          if last_success_time.tzinfo is None or age_minutes < -1 or age_minutes > 45:
              raise SystemExit(f"Server Smart Alerts last success is outside the 45-minute release window (age={age_minutes:.1f}m).")
          if scheduler.get("isStuck") is True or int(scheduler.get("stuckRunCount") or 0) > 0:
              raise SystemExit("Server Smart Alerts reports a stuck scheduler run.")
          print(
              "Scheduler execution: PASS; Server Smart Alerts last success "
              + str(last_success)
              + f" ({age_minutes:.1f} minutes ago)."
          )

          reentry = jobs.get("reentry-alerts")
          if not reentry:
              raise SystemExit("Scheduler health did not include the Re-entry workflow.")
          delivery = reentry.get("deliveryHealth")
          if reentry.get("deliveryHealthError") or not isinstance(delivery, dict):
              raise SystemExit("Re-entry delivery ledger could not be read after deployment.")
          counts = delivery.get("statusCounts")
          if not isinstance(counts, dict):
              raise SystemExit("Re-entry delivery ledger did not return status counts.")
          for status in ("sending", "accepted", "rejected", "uncertain"):
              if not isinstance(counts.get(status), int) or counts[status] < 0:
                  raise SystemExit(f"Re-entry delivery ledger has an invalid {status} count.")
          ledger_rows = delivery.get("deliveryLedgerRowsInWindow")
          if not isinstance(ledger_rows, int) or ledger_rows < 0:
              raise SystemExit("Re-entry delivery ledger row count is invalid.")
          print(
              "Re-entry delivery ledger: PASS; rows=" + str(ledger_rows)
              + ", accepted=" + str(counts["accepted"])
              + ", rejected=" + str(counts["rejected"])
              + ", uncertain=" + str(counts["uncertain"])
              + ", sending=" + str(counts["sending"])
              + ", active_watchlist=" + str(delivery.get("activeWatchlistRows"))
              + "."
          )
          if counts["accepted"] > 0 and delivery.get("lastAcceptedAt"):
              print("Telegram API acceptance: historical accepted delivery is recorded at " + str(delivery["lastAcceptedAt"]) + ".")
          else:
              print("::notice::No accepted Re-entry Telegram delivery is recorded in the current ledger window. No test message was sent; the dual Re-entry release gate remains in control.")
          print("Post-deploy health checks completed. These checks do not send Telegram messages or enable Re-entry.")
          PY
