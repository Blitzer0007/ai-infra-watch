name: Vercel Python CI

on:
  push:
    branches: [main]
    paths:
      - "api/agent-python.py"
      - "api/jev-assess.py"
      - "requirements.txt"
      - "aitracker-upload/app/**"
      - "aitracker-upload/mcp_servers/**"
      - "aitracker-upload/data/**"
      - ".github/workflows/vercel-python-ci.yml"
  pull_request:
    paths:
      - "api/agent-python.py"
      - "requirements.txt"
      - "aitracker-upload/app/**"
      - "aitracker-upload/mcp_servers/**"
      - "aitracker-upload/data/**"
      - ".github/workflows/vercel-python-ci.yml"

concurrency:
  group: vercel-python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import-entrypoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile and import Vercel entrypoint
        run: |
          python -m py_compile api/agent-python.py
          PYTHONPATH=aitracker-upload python - <<'PY'
          import importlib.util

          spec = importlib.util.spec_from_file_location(
              "vercel_agent", "api/agent-python.py"
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          assert module.app.title == "AI Infra Watch Autonomous Agent"
          print("Vercel Python entrypoint import passed")
          PY

      - name: Compile and import Jev assessment entrypoint
        run: |
          python -m py_compile api/jev-assess.py
          PYTHONPATH=aitracker-upload python - <<'PY'
          import importlib.util

          spec = importlib.util.spec_from_file_location(
              "vercel_jev", "api/jev-assess.py"
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          assert module.app.title == "AI Infra Watch Jev Assessment"
          print("Jev assessment entrypoint import passed")
          PY
