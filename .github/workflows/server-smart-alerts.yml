name: Server Smart Alerts
run-name: Server Smart Alerts • ${{ github.event.schedule || 'manual' }}

on:
  schedule:
    # Evaluate server-side price/Smart Move alerts every 10 minutes.
    # Catalyst feeds are scanned every 30 minutes by the endpoint to reduce upstream load.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: server-smart-alerts
  cancel-in-progress: true

jobs:
  evaluate:
    name: Evaluate and deliver smart alerts
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::GitHub OIDC token endpoint is unavailable."
            exit 1
          fi
          OIDC_RESPONSE=$(curl --fail-with-body --silent --show-error --get --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" --data-urlencode "audience=ai-infra-watch" "$ACTIONS_ID_TOKEN_REQUEST_URL")
          OIDC_TOKEN=$(printf '%s' "$OIDC_RESPONSE" | node -e "let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>process.stdout.write(JSON.parse(d).value||''));")
          if [ -z "$OIDC_TOKEN" ]; then echo "::error::GitHub OIDC token response did not contain a token."; exit 1; fi
          echo "::add-mask::$OIDC_TOKEN"
          echo "token=$OIDC_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run server smart alert evaluator
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request GET \
            --header "Authorization: Bearer $OIDC_TOKEN" \
            --header "User-Agent: ai-infra-watch-github-actions/2.0" \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 3 \
            "https://ai-infra-watch-theta.vercel.app/api/server-alerts?scheduled=1"
      - name: Record completion
        run: echo "Server smart alert evaluation completed at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
