name: Experimental Vite-free dependency audit

on:
  push:
    branches: [experiment/m4-vite-free-build-security]

permissions:
  contents: write

jobs:
  dependency-proof:
    name: Vite-free audit, code quality, build and lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Reconcile lockfile to reviewed Vite-free package manifest
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify reproducible installation
        run: npm ci
      - name: Required unmodified npm vulnerability gate
        run: npm audit --audit-level=low
      - name: Test TypeScript, units, security and production bundle
        run: |
          npm run security:audit
          npm run lint
          npm run test:unit
          npm run build
      - name: Check generated output and absence of Vite
        run: |
          test -s dist/index.html
          test -s dist/assets/styles.css
          test -s dist/assets/main.js
          ! grep -q '/src/main.tsx' dist/index.html
          if npm ls vite picomatch --all 2>/dev/null; then echo 'Unexpected vulnerable build chain'; exit 1; fi
      - name: Commit reviewed lockfile after all gates pass
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already current'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: lock Vite-free audited dependency graph"
          git push origin HEAD:refs/heads/experiment/m4-vite-free-build-security

  mocked-browser:
    name: Full offline mocked Playwright browser acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile QA-only static browser assets
        env:
          VITE_QA_MODE: "true"
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline QA requirements and Chromium
        run: |
          python -m pip install -r qa/requirements.txt
          python -m pip install -r aitracker-upload/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Start safe local static server
        run: |
          nohup npm run serve:static > /tmp/aiw-local.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0; sleep 2; done
          cat /tmp/aiw-local.log
          exit 1
      - name: Run full mocked browser suite
        env:
          QA_BASE_URL: http://127.0.0.1:3000
          QA_UI_MOCKS: "true"
        run: python -m pytest -q qa/test_ui.py qa/test_ui_exploratory.py qa/test_glossary_release.py qa/test_decision_accounting.py qa/test_portfolio_rule_kernel.py qa/test_milestone1_portfolio.py qa/test_milestone2_candidate.py qa/test_alert_inbox.py qa/test_release2.py qa/test_company_research_navigation.py qa/test_catalyst_calendar.py qa/test_source_quality_ui.py qa/test_portfolio_council_ui.py qa/test_milestone3_candidate.py qa/test_milestone4_candidate.py
