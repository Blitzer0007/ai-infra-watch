name: Experimental Vite-free dependency audit

on:
  push:
    branches: [experiment/m4-vite-free-build-security]

permissions:
  contents: write

jobs:
  dependency-proof:
    name: Vite-free audit, code quality, build and lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Reconcile lockfile to reviewed Vite-free package manifest
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify reproducible installation
        run: npm ci
      - name: Required unmodified npm vulnerability gate
        run: npm audit --audit-level=low
      - name: Test TypeScript, units, security and production bundle
        run: |
          npm run security:audit
          npm run lint
          npm run test:unit
          npm run build
      - name: Check generated output and absence of Vite
        run: |
          test -s dist/index.html
          test -s dist/assets/styles.css
          test -s dist/assets/main.js
          ! grep -q '/src/main.tsx' dist/index.html
          if npm ls vite picomatch --all 2>/dev/null; then echo 'Unexpected vulnerable build chain'; exit 1; fi
      - name: Commit reviewed lockfile after all gates pass
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already current'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: lock Vite-free audited dependency graph"
          git push origin HEAD:refs/heads/experiment/m4-vite-free-build-security
