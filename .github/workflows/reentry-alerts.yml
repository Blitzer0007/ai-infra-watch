name: Re-entry Telegram Alerts
run-name: Re-entry scan • ${{ github.event.schedule || 'manual' }}
on:
  # Scheduled runs are paused until the durable Telegram outbox is deployed and delivery is verified.
  # Manual dispatch remains available for an explicitly approved operator-initiated run.
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: reentry-alerts
  cancel-in-progress: false
jobs:
  scan:
    # Hard release gate: keep all re-entry scans disabled until the durable outbox is deployed and verified.
    if: ${{ false }}
    runs-on: ubuntu-slim
    timeout-minutes: 8
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        run: |
          set -euo pipefail
          RESPONSE=$(curl --fail-with-body --silent --show-error --get --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" --data-urlencode "audience=ai-infra-watch" "$ACTIONS_ID_TOKEN_REQUEST_URL")
          TOKEN=$(printf '%s' "$RESPONSE" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>process.stdout.write(JSON.parse(d).value||''));")
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Scan sold-stock re-entry watchlist and send Telegram alerts
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          FALLBACK_TOKEN: ${{ secrets.AIW_CRON_SECRET }}
        run: |
          set -euo pipefail
          URL="https://ai-infra-watch-theta.vercel.app/api/reentry-alerts?run=true"
          # This endpoint can send Telegram messages. Do not automatically retry after an
          # ambiguous network/5xx outcome: the first request may already have sent.
          CODE=$(curl --silent --show-error --output response.json --write-out '%{http_code}' --header "Authorization: Bearer $OIDC_TOKEN" "$URL")
          # Fall back only when the request was rejected by authentication before scan.
          if { [ "$CODE" = "401" ] || [ "$CODE" = "403" ]; } && [ -n "${FALLBACK_TOKEN:-}" ]; then
            CODE=$(curl --silent --show-error --output response.json --write-out '%{http_code}' --header "Authorization: Bearer $FALLBACK_TOKEN" "$URL")
          fi
          cat response.json
          test "$CODE" = "200"
          node -e "const d=require('./response.json');if(!d.ok)process.exit(1);if(d.scanned===0||d.scanStatus==='empty_watchlist'){console.error('Empty active re-entry watchlist: no entries were evaluated; this is not a completed evaluation.');process.exit(1)}if(d.scanStatus==='incomplete_scan'||d.scanStatus==='completed_with_errors'||d.errors?.length){console.error((d.errors||[]).join('\\n')||('Scan status: '+d.scanStatus));process.exit(1)}"
