name: Re-entry Telegram Alerts
run-name: Re-entry scan • ${{ github.event.schedule || 'scheduled' }}
on:
  # The 15-minute poll spans US regular-session hours year-round; the New York-time preflight below is authoritative.
  # The opt-in variable must remain unset/false until the guarded API code is deployed and the release is approved.
  schedule:
    - cron: "*/15 13-20 * * 1-5"
permissions:
  contents: read
  id-token: write
concurrency:
  group: reentry-alerts
  cancel-in-progress: false
jobs:
  scan:
    # Hard release gate: repository variable is intentionally not set by this PR.
    if: ${{ vars.REENTRY_ALERTS_ENABLED == 'true' }}
    runs-on: ubuntu-slim
    timeout-minutes: 8
    steps:
      - name: Confirm New York regular-session window
        id: session
        shell: bash
        run: |
          set -euo pipefail
          SESSION_OPEN="$(node -e 'const p=Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).filter(x=>x.type!=="literal").map(x=>[x.type,x.value]));const n=Number(p.hour)*60+Number(p.minute);console.log(!["Sat","Sun"].includes(p.weekday)&&n>=570&&n<960?"true":"false")')"
          echo "open=$SESSION_OPEN" >> "$GITHUB_OUTPUT"
          if [ "$SESSION_OPEN" != "true" ]; then
            echo "::notice::New York regular equity session is closed; skipping this re-entry scan."
          fi

      - name: Request GitHub OIDC token
        if: steps.session.outputs.open == 'true'
        id: oidc
        run: |
          set -euo pipefail
          RESPONSE=$(curl --fail-with-body --silent --show-error --get --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" --data-urlencode "audience=ai-infra-watch" "$ACTIONS_ID_TOKEN_REQUEST_URL")
          TOKEN=$(printf '%s' "$RESPONSE" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>process.stdout.write(JSON.parse(d).value||''));")
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Scan sold-stock re-entry watchlist and send Telegram alerts
        if: steps.session.outputs.open == 'true'
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          FALLBACK_TOKEN: ${{ secrets.AIW_CRON_SECRET }}
        run: |
          set -euo pipefail
          URL="https://ai-infra-watch-theta.vercel.app/api/reentry-alerts?run=true"
          # This endpoint can send Telegram messages. Do not automatically retry after an
          # ambiguous network/5xx outcome: the first request may already have sent.
          CODE=$(curl --silent --show-error --output response.json --write-out '%{http_code}' --header "Authorization: Bearer $OIDC_TOKEN" "$URL")
          # Fall back only when the request was rejected by authentication before scan.
          if { [ "$CODE" = "401" ] || [ "$CODE" = "403" ]; } && [ -n "${FALLBACK_TOKEN:-}" ]; then
            CODE=$(curl --silent --show-error --output response.json --write-out '%{http_code}' --header "Authorization: Bearer $FALLBACK_TOKEN" "$URL")
          fi
          if [ "$CODE" != "200" ]; then
            echo "::error::Re-entry endpoint returned HTTP $CODE; response body is suppressed."
            exit 1
          fi
          node <<'NODE'
          const fs = require('node:fs');
          let data;
          try {
            data = JSON.parse(fs.readFileSync('response.json', 'utf8'));
          } catch {
            console.error('Re-entry endpoint returned invalid JSON; response body is suppressed.');
            process.exit(1);
          }
          if (!data || typeof data !== 'object' || Array.isArray(data)) {
            console.error('Re-entry endpoint returned an unexpected response shape; body suppressed.');
            process.exit(1);
          }
          const summary = {
            ok: data.ok === true,
            scanStatus: typeof data.scanStatus === 'string' ? data.scanStatus : 'unknown',
            activeRows: Number.isInteger(data.activeRows) ? data.activeRows : null,
            evaluatedRows: Number.isInteger(data.evaluatedRows) ? data.evaluatedRows : null,
            qualifyingCandidates: Number.isInteger(data.qualifyingCandidates) ? data.qualifyingCandidates : null,
            notifyEligibleCandidates: Number.isInteger(data.notifyEligibleCandidates) ? data.notifyEligibleCandidates : null,
            notificationsDeferred: Number.isInteger(data.notificationsDeferred) ? data.notificationsDeferred : null,
            telegramSent: Number.isInteger(data.telegramSent) ? data.telegramSent : null,
            telegramPreviouslyAccepted: Number.isInteger(data.telegramPreviouslyAccepted) ? data.telegramPreviouslyAccepted : null,
            errorCount: Array.isArray(data.errors) ? data.errors.length : null,
          };
          console.log('Re-entry scan summary (watchlist rows, theses, message IDs and error details omitted): ' + JSON.stringify(summary));
          if (data.ok !== true) {
            console.error('Re-entry scan reported failure; private response details are suppressed.');
            process.exit(1);
          }
          if (data.activeRows === 0 || data.scanStatus === 'empty_watchlist') {
            console.error('Empty active re-entry watchlist: no entries were evaluated.');
            process.exit(1);
          }
          if (data.scanStatus === 'incomplete_scan' || data.scanStatus === 'completed_with_errors' || (Array.isArray(data.errors) && data.errors.length > 0)) {
            console.error('Re-entry scan was incomplete or had errors; private details are suppressed.');
            process.exit(1);
          }
          NODE
