name: Debug Typecheck
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture TypeScript errors
        run: |
          set +e
          npm run lint > /tmp/typecheck.log 2>&1
          code=$?
          cat /tmp/typecheck.log
          cp /tmp/typecheck.log ci-typecheck-error.txt
          echo "EXIT_CODE=$code" > ci-typecheck-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git checkout -B ci-debug
          git add ci-typecheck-error.txt ci-typecheck-status.txt
          git commit -m "ci: publish typecheck diagnostics" || true
          git push --force origin ci-debug
          exit 0
