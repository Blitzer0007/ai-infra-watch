name: Production Validation Unit CI

on:
  pull_request:
    paths:
      - "tests/production_validation/**"
      - ".github/workflows/production-validation-ci.yml"
  push:
    branches: [main]
    paths:
      - "tests/production_validation/**"
      - ".github/workflows/production-validation-ci.yml"

permissions:
  contents: read

jobs:
  historical-validator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/production_validation/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r tests/production_validation/requirements.txt
      - name: Test historical evidence validation rules
        run: python -m pytest -q tests/production_validation/test_historical_evidence.py
