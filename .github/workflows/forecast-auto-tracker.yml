name: Forecast Auto Tracker · 5D + 20D
run-name: Forecast Auto Tracker • ${{ github.event.schedule || github.event_name }}

on:
  schedule:
    # Supabase Cron is the independent primary scheduler; GitHub remains a secondary recovery path.
    - cron: '15 1 * * 1-5'
    - cron: '45 1 * * 1-5'
  workflow_dispatch:

concurrency:
  group: forecast-auto-tracker
  cancel-in-progress: false

jobs:
  create-forecasts:
    name: Track 5D + 20D forecasts for held portfolio
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Run forecast auto tracker with GitHub OIDC
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::GitHub Actions OIDC token endpoint is unavailable."
            echo "::error::Verify that this job has id-token: write permission."
            exit 1
          fi

          OIDC_RESPONSE="$(curl --fail-with-body --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 3 \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --get --data-urlencode "audience=ai-infra-watch" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")""

          OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | jq -er '.value')"

          if [ -z "$OIDC_TOKEN" ]; then
            echo "::error::GitHub Actions returned an empty OIDC token."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request GET \
            --header "Authorization: Bearer $OIDC_TOKEN" \
            --header "User-Agent: ai-infra-watch-forecast-auto-tracker/2.0" \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 3 \
            "https://ai-infra-watch-theta.vercel.app/api/forecast-auto-track"

          echo "Verifying forecasts that have reached their target date..."
          curl --fail-with-body --silent --show-error \
            --request GET \
            --header "Authorization: Bearer $OIDC_TOKEN" \
            --header "User-Agent: ai-infra-watch-forecast-verification/1.0" \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 3 \
            "https://ai-infra-watch-theta.vercel.app/api/forecast-verification"
