name: Forecast Auto Tracker
run-name: Forecast Auto Tracker • ${{ github.event.schedule || github.event_name }}

on:
  schedule:
    # Supabase Cron is the independent primary scheduler; GitHub remains a secondary recovery path.
    - cron: '15 1 * * 1-5'
    - cron: '45 1 * * 1-5'
  workflow_dispatch:

concurrency:
  group: forecast-auto-tracker
  cancel-in-progress: false

jobs:
  create-forecasts:
    name: Track 20D forecasts for held portfolio
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Run forecast auto tracker
        env:
          AIW_CRON_SECRET: ${{ secrets.AIW_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$AIW_CRON_SECRET" ]; then
            echo "::error::Missing AIW_CRON_SECRET repository secret."
            exit 1
          fi
          curl --fail-with-body --silent --show-error             --request GET             --header "Authorization: Bearer $AIW_CRON_SECRET"             --header "User-Agent: ai-infra-watch-forecast-auto-tracker/1.0"             --retry 3             --retry-all-errors             --retry-delay 3             "https://ai-infra-watch-theta.vercel.app/api/forecast-auto-track"
