name: Private archive credential preflight

on:
  push:
    branches:
      - ops/private-archive-credential-preflight

permissions:
  contents: read

jobs:
  check-presence-only:
    name: Verify required secret names without using them
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check secret presence without exposing values or making network calls
        shell: bash
        env:
          OHLC_API_KEY: ${{ secrets.OHLC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HISTORICAL_EVIDENCE_ARCHIVE_ENABLED: ${{ vars.HISTORICAL_EVIDENCE_ARCHIVE_ENABLED }}
        run: |
          set -euo pipefail
          missing=0
          for name in OHLC_API_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [[ -n "${!name:-}" ]]; then
              echo "credential_present=${name}"
            else
              echo "credential_missing=${name}"
              missing=1
            fi
          done
          if [[ "${HISTORICAL_EVIDENCE_ARCHIVE_ENABLED:-}" == "true" ]]; then
            echo "archive_enable_variable=true"
          else
            echo "archive_enable_variable=not_true"
          fi
          if [[ "$missing" -ne 0 ]]; then
            echo "Preflight failed closed. No credentials were printed and no external requests were made."
            exit 1
          fi
          echo "Secrets are present. No provider or Supabase request was made."
# Comment-only trigger to recheck configuration presence; no provider requests are made.
