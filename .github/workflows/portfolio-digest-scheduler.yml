name: Portfolio Digest Scheduler
run-name: Portfolio Digest • ${{ github.event.schedule || 'manual' }}

on:
  schedule:
    # Five minutes after the requested hours; consolidated cron syntax also
    # forces GitHub to register the schedule definition as a changed workflow.
    # UTC → 06:05, 12:05, 18:05 and 22:05 Asia/Kolkata.
    - cron: '35 0,6,12,16 * * *'
  workflow_dispatch:

concurrency:
  group: portfolio-digest-scheduler
  cancel-in-progress: false

jobs:
  send-digest:
    name: Send Telegram portfolio digest
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Run portfolio digest
        env:
          AIW_CRON_SECRET: ${{ secrets.AIW_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$AIW_CRON_SECRET" ]; then
            echo "::error::Missing AIW_CRON_SECRET repository secret."
            exit 1
          fi

          SLOT=$(TZ=Asia/Kolkata date '+%Y-%m-%d-%H')

          curl --fail-with-body --silent --show-error             --request GET             --header "Authorization: Bearer $AIW_CRON_SECRET"             --header "User-Agent: ai-infra-watch-github-actions/2.0"             --retry 3             --retry-all-errors             --retry-delay 3             "https://ai-infra-watch-theta.vercel.app/api/portfolio-digest?slot=$SLOT"

      - name: Record completion
        run: echo "Portfolio digest scheduler completed at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
