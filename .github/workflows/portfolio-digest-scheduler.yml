name: Portfolio Digest Scheduler
run-name: Portfolio Digest • ${{ github.event.schedule || 'manual/push' }}

on:
  schedule:
    # Five minutes after each requested local digest time.
    # Separate entries let github.event.schedule identify the intended slot.
    # UTC → 06:05, 12:05, 18:05 and 22:05 Asia/Kolkata.
    - cron: '35 0 * * *'
    - cron: '35 6 * * *'
    - cron: '35 12 * * *'
    - cron: '35 16 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: portfolio-digest-scheduler
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  send-digest:
    name: Send Telegram portfolio digest
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[send-digest]')
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::GitHub OIDC token endpoint is unavailable."
            exit 1
          fi
          OIDC_RESPONSE=$(curl --fail-with-body --silent --show-error \
            --get \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=ai-infra-watch" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")
          OIDC_TOKEN=$(printf '%s' "$OIDC_RESPONSE" | node -e "let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>process.stdout.write(JSON.parse(d).value||''));")
          if [ -z "$OIDC_TOKEN" ]; then
            echo "::error::GitHub OIDC token response did not contain a token."
            exit 1
          fi
          echo "::add-mask::$OIDC_TOKEN"
          echo "token=$OIDC_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run portfolio digest
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          SCHEDULE="${{ github.event.schedule || '' }}"
          case "$SCHEDULE" in
            *" 0 "*) EXPECTED_HOUR=6 ;;
            *" 6 "*) EXPECTED_HOUR=12 ;;
            *" 12 "*) EXPECTED_HOUR=18 ;;
            *" 16 "*) EXPECTED_HOUR=22 ;;
            *) EXPECTED_HOUR=$(TZ=Asia/Kolkata date '+%H') ;;
          esac
          NOW_DATE=$(TZ=Asia/Kolkata date '+%Y-%m-%d')
          NOW_HOUR=$(TZ=Asia/Kolkata date '+%H')
          if (( 10#$NOW_HOUR < EXPECTED_HOUR )); then
            SLOT_DATE=$(TZ=Asia/Kolkata date -d 'yesterday' '+%Y-%m-%d')
          else
            SLOT_DATE="$NOW_DATE"
          fi
          SLOT="$SLOT_DATE-$(printf '%02d' "$EXPECTED_HOUR")"
          echo "Intended digest slot: $SLOT (actual execution: $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S %Z'))"
          curl --fail-with-body --silent --show-error \
            --request GET \
            --header "Authorization: Bearer $OIDC_TOKEN" \
            --header "User-Agent: ai-infra-watch-github-actions/3.0" \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 3 \
            "https://ai-infra-watch-theta.vercel.app/api/portfolio-digest?slot=$SLOT"

      - name: Record completion
        run: echo "Portfolio digest scheduler completed at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
