name: Security audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: Source security and dependency inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Audit tracked source and deployment workflow
        run: npm run security:audit

      - name: Report dependency advisories for triage
        shell: bash
        run: |
          set +e
          npm audit --json > "$RUNNER_TEMP/npm-audit.json"
          audit_status=$?
          set -e
          node --input-type=module - "$RUNNER_TEMP/npm-audit.json" "$audit_status" <<'NODE'
          import { readFileSync } from 'node:fs';
          const [file, auditStatus] = process.argv.slice(2);
          const report = JSON.parse(readFileSync(file, 'utf8'));
          const vulnerabilities = report.vulnerabilities || {};
          const summary = report.metadata?.vulnerabilities || {};
          console.log('Dependency audit summary:', JSON.stringify(summary));
          for (const [name, item] of Object.entries(vulnerabilities)) {
            const advisories = (item.via || []).filter(value => value && typeof value === 'object').map(value => ({
              title: value.title,
              severity: value.severity,
              url: value.url,
              range: value.range,
            }));
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              advisories,
            }));
          }
          console.log('npm audit exit status:', auditStatus);
          NODE

      - name: Build a lockfile-only remediation candidate
        continue-on-error: true
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund --no-progress

      - name: Summarize remaining advisories after candidate fix
        if: always()
        shell: bash
        run: |
          set +e
          npm audit --json > "$RUNNER_TEMP/npm-audit-after.json"
          audit_status=$?
          set -e
          node --input-type=module - "$RUNNER_TEMP/npm-audit-after.json" "$audit_status" <<'NODE'
          import { readFileSync } from 'node:fs';
          const [file, status] = process.argv.slice(2);
          const report = JSON.parse(readFileSync(file, 'utf8'));
          console.log('Post-fix dependency audit:', JSON.stringify(report.metadata?.vulnerabilities || {}));
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            console.log(JSON.stringify({ package: name, severity: item.severity, fixAvailable: item.fixAvailable }));
          }
          console.log('Post-fix npm audit exit status:', status);
          NODE

      - name: Upload non-committing package-lock candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-remediation-candidate
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
