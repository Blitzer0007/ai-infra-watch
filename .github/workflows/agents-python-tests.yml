name: Python Agents Tests

on:
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "tests/test_agents.py"
      - "tests/test_mcp_integration.py"
      - "aitracker-upload/mcp_servers/**"
      - "aitracker-upload/app/rag/**"
      - "aitracker-upload/app/agents/**"
      - "aitracker-upload/app/mcp_client/**"
      - "aitracker-upload/requirements-ingest.txt"
      - "aitracker-upload/tests/agents/**"
      - "aitracker-upload/tests/mcp/**"
      - ".github/workflows/agents-python-tests.yml"
  pull_request:
    paths:
      - "agents/**"
      - "tests/test_agents.py"
      - "tests/test_mcp_integration.py"
      - "aitracker-upload/mcp_servers/**"
      - "aitracker-upload/app/rag/**"
      - ".github/workflows/agents-python-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agent dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r agents/requirements.txt

      - name: Run root LangGraph tests
        run: python -m pytest -q tests/test_agents.py tests/test_mcp_integration.py

      - name: Install backend agent dependencies
        # RAG retrieval modules used by the backend agents import numpy and rank-bm25.
        # Keep these lightweight dependencies explicit in CI.
        run: |
          python -m pip install -r aitracker-upload/requirements.txt
          python -m pip install -r aitracker-upload/requirements-ingest.txt

      - name: Run autonomous agent tests
        env:
          PYTHONPATH: aitracker-upload
          EVAL_STUB: "true"
        run: python -m pytest -q aitracker-upload/tests/agents/test_autonomous.py

      - name: Run MCP contract tests
        env:
          PYTHONPATH: aitracker-upload
          EVAL_STUB: "true"
        run: python -m pytest -q aitracker-upload/tests/mcp/test_stocks_contract.py aitracker-upload/tests/mcp/test_filings_contract.py
