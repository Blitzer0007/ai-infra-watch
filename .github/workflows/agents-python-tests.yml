name: Python Agents Tests

on:
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "tests/test_agents.py"
      - "tests/test_mcp_integration.py"
      - "aitracker-upload/mcp_servers/**"
      - "api/live-data.js"
      - "aitracker-upload/app/rag/**"
      - "aitracker-upload/app/agents/**"
      - "aitracker-upload/app/eval/**"
      - "aitracker-upload/tests/eval/**"
      - "aitracker-upload/data/research/council-benchmark.fictional.json"
      - "aitracker-upload/data/research/research-role-review.fictional.json"
      - "aitracker-upload/app/mcp_client/**"
      - "aitracker-upload/app/config/**"
      - "aitracker-upload/app/llm/**"
      - "aitracker-upload/app/jev/**"
      - "aitracker-upload/requirements-ingest.txt"
      - "aitracker-upload/scripts/**"
      - "aitracker-upload/tests/agents/**"
      - "aitracker-upload/tests/mcp/**"
      - "aitracker-upload/tests/api/**"
      - ".github/workflows/agents-python-tests.yml"
  pull_request:
    paths:
      - "agents/**"
      - "tests/test_agents.py"
      - "tests/test_mcp_integration.py"
      - "aitracker-upload/mcp_servers/**"
      - "aitracker-upload/app/rag/**"
      - "aitracker-upload/app/agents/**"
      - "aitracker-upload/app/eval/**"
      - "aitracker-upload/tests/eval/**"
      - "aitracker-upload/data/research/council-benchmark.fictional.json"
      - "aitracker-upload/data/research/research-role-review.fictional.json"
      - "aitracker-upload/app/mcp_client/**"
      - "aitracker-upload/app/config/**"
      - "aitracker-upload/app/llm/**"
      - "aitracker-upload/app/jev/**"
      - "aitracker-upload/scripts/**"
      - "aitracker-upload/tests/agents/**"
      - "aitracker-upload/tests/mcp/**"
      - "aitracker-upload/tests/api/**"
      - ".github/workflows/agents-python-tests.yml"

concurrency:
  group: python-agents-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agent dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r agents/requirements.txt

      - name: Run root LangGraph tests
        run: python -m pytest -q tests/test_agents.py tests/test_mcp_integration.py

      - name: Install backend agent dependencies
        # RAG retrieval modules used by the backend agents import numpy and rank-bm25.
        # Keep these lightweight dependencies explicit in CI.
        run: |
          python -m pip install -r aitracker-upload/requirements.txt
          python -m pip install -r aitracker-upload/requirements-ingest.txt

      - name: Run autonomous agent tests
        env:
          PYTHONPATH: aitracker-upload
          EVAL_STUB: "true"
        run: python -m pytest -q aitracker-upload/tests/agents/test_autonomous.py aitracker-upload/tests/agents/test_debate.py aitracker-upload/tests/agents/test_jev_client.py aitracker-upload/tests/agents/test_evidence_quality.py aitracker-upload/tests/agents/test_source_quality.py aitracker-upload/tests/agents/test_portfolio_council.py aitracker-upload/tests/agents/test_council_admission.py aitracker-upload/tests/agents/test_council_role_models.py aitracker-upload/tests/agents/test_research_role_review.py

      - name: Run MCP contract tests
        env:
          PYTHONPATH: aitracker-upload
          EVAL_STUB: "true"
        run: |
          python -m pytest -q             aitracker-upload/tests/mcp/test_stocks_contract.py             aitracker-upload/tests/mcp/test_filings_contract.py             aitracker-upload/tests/mcp/test_contracts.py             aitracker-upload/tests/mcp/test_event_study.py             aitracker-upload/tests/mcp/test_relationships.py             aitracker-upload/tests/mcp/test_research_sources.py             aitracker-upload/tests/mcp/test_provider_budget.py             aitracker-upload/tests/mcp/test_stocks_service.py             aitracker-upload/tests/mcp/test_stocks_providers.py             aitracker-upload/tests/mcp/test_quote_provenance.py

      - name: Run API contract tests
        env:
          PYTHONPATH: aitracker-upload
          EVAL_STUB: "true"
        run: python -m pytest -q aitracker-upload/tests/api/test_contracts_endpoint.py aitracker-upload/tests/api/test_autonomous_auth.py aitracker-upload/tests/api/test_agent_python_runtime.py

      - name: Run evaluation harness tests
        env:
          PYTHONPATH: aitracker-upload
          EVAL_STUB: "true"
        run: python -m pytest -q aitracker-upload/tests/eval

      - name: Generate offline council comparison
        env:
          PYTHONPATH: aitracker-upload
        run: python aitracker-upload/scripts/council_model_benchmark.py --format markdown > /tmp/council-offline-comparison.md

      - name: Upload fictional council comparison
        uses: actions/upload-artifact@v4
        with:
          name: council-offline-comparison
          path: /tmp/council-offline-comparison.md

