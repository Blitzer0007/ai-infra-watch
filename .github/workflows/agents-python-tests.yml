name: Python Agents Tests

on:
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "tests/test_agents.py"
      - "tests/test_mcp_integration.py"
      - "aitracker-upload/mcp_servers/**"
      - "api/live-data.js"
      - "aitracker-upload/app/rag/**"
      - "aitracker-upload/app/agents/**"
      - "aitracker-upload/app/mcp_client/**"
      - "aitracker-upload/app/config/**"
      - "aitracker-upload/app/llm/**"
      - "aitracker-upload/app/jev/**"
      - "aitracker-upload/requirements-ingest.txt"
      - "aitracker-upload/scripts/**"
      - "aitracker-upload/tests/agents/**"
      - "aitracker-upload/tests/mcp/**"
      - "aitracker-upload/tests/api/**"
      - ".github/workflows/agents-python-tests.yml"
  pull_request:
    paths:
      - "agents/**"
      - "tests/test_agents.py"
      - "tests/test_mcp_integration.py"
      - "aitracker-upload/mcp_servers/**"
      - "aitracker-upload/app/rag/**"
      - "aitracker-upload/app/agents/**"
      - "aitracker-upload/app/mcp_client/**"
      - "aitracker-upload/app/config/**"
      - "aitracker-upload/app/llm/**"
      - "aitracker-upload/app/jev/**"
      - "aitracker-upload/scripts/**"
      - "aitracker-upload/tests/agents/**"
      - "aitracker-upload/tests/mcp/**"
      - "aitracker-upload/tests/api/**"
      - ".github/workflows/agents-python-tests.yml"

concurrency:
  group: python-agents-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agent dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r agents/requirements.txt

      - name: Run root LangGraph tests
        run: python -m pytest -q tests/test_agents.py tests/test_mcp_integration.py

      - name: Install backend agent dependencies
        # RAG retrieval modules used by the backend agents import numpy and rank-bm25.
        # Keep these lightweight dependencies explicit in CI.
        run: |
          python -m pip install -r aitracker-upload/requirements.txt
          python -m pip install -r aitracker-upload/requirements-ingest.txt

      - name: Run autonomous agent tests
        env:
          PYTHONPATH: aitracker-upload
          EVAL_STUB: "true"
        run: python -m pytest -q aitracker-upload/tests/agents/test_autonomous.py aitracker-upload/tests/agents/test_debate.py aitracker-upload/tests/agents/test_jev_client.py aitracker-upload/tests/agents/test_evidence_quality.py

      - name: Run MCP contract tests
        env:
          PYTHONPATH: aitracker-upload
          EVAL_STUB: "true"
        run: |
          python -m pytest -q             aitracker-upload/tests/mcp/test_stocks_contract.py             aitracker-upload/tests/mcp/test_filings_contract.py             aitracker-upload/tests/mcp/test_contracts.py             aitracker-upload/tests/mcp/test_event_study.py             aitracker-upload/tests/mcp/test_relationships.py             aitracker-upload/tests/mcp/test_research_sources.py

      - name: Run API contract tests
        env:
          PYTHONPATH: aitracker-upload
          EVAL_STUB: "true"
        run: python -m pytest -q aitracker-upload/tests/api/test_contracts_endpoint.py aitracker-upload/tests/api/test_autonomous_auth.py aitracker-upload/tests/api/test_agent_python_runtime.py aitracker-upload/tests/api/test_source_quality_endpoint.py

      - name: Run offline quote provenance and specialist regressions
        env:
          PYTHONPATH: aitracker-upload
          EVAL_STUB: "true"
          LLM_PROVIDER: "stub"
          EVAL_CACHE_ENABLED: "false"
        run: |
          python -m pytest -q -m "not live" \
            aitracker-upload/tests/agents/test_source_quality.py \
            aitracker-upload/tests/agents/test_live_planner_contract.py \
            aitracker-upload/tests/mcp/test_quote_provenance.py \
            aitracker-upload/tests/mcp/test_stocks_providers.py \
            aitracker-upload/tests/mcp/test_stocks_service.py \
            aitracker-upload/tests/mcp/test_stocks_feed.py \
            aitracker-upload/tests/mcp/test_inprocess.py \
            aitracker-upload/tests/agents/test_market_agent.py \
            aitracker-upload/tests/agents/test_filings_agent.py \
            aitracker-upload/tests/agents/test_supervisor.py \
            aitracker-upload/tests/agents/test_hallucination_audit.py \
            aitracker-upload/tests/agents/test_symbol_extraction.py

      - name: Run evaluation harness tests
        env:
          PYTHONPATH: aitracker-upload
          EVAL_STUB: "true"
        run: python -m pytest -q aitracker-upload/tests/eval

