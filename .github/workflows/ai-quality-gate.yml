name: AI Quality Gate

on:
  pull_request:
    paths:
      - "scripts/ai_quality_gate.py"
      - "scripts/ai_quality_fixture.json"
      - "scripts/run_red_team.py"
      - "scripts/ai_quality_regression.py"
      - "scripts/ai_red_team_fixture.json"
      - "scripts/ai_quality_baseline.json"
      - "src/components/AIQualityLab.tsx"
      - "src/utils/aiQualityApi.ts"
      - "api/ai-quality.js"
      - "aitracker-upload/app/eval/**"
      - "aitracker-upload/tests/eval/**"
      - ".github/workflows/ai-quality-gate.yml"
  push:
    branches: [main]
    paths:
      - "scripts/ai_quality_gate.py"
      - "scripts/ai_quality_fixture.json"
      - "scripts/run_red_team.py"
      - "scripts/ai_quality_regression.py"
      - "scripts/ai_red_team_fixture.json"
      - "scripts/ai_quality_baseline.json"
      - "src/components/AIQualityLab.tsx"
      - "src/utils/aiQualityApi.ts"
      - "api/ai-quality.js"
      - "aitracker-upload/app/eval/**"
      - "aitracker-upload/tests/eval/**"
      - ".github/workflows/ai-quality-gate.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r aitracker-upload/requirements.txt
          python -m pip install "mcp>=2.2,<3"
      - name: Run evaluation harness tests
        env:
          PYTHONPATH: aitracker-upload
          EVAL_STUB: "true"
        run: python -m pytest -q aitracker-upload/tests/eval
      - name: Run deterministic AI quality gate
        run: python scripts/ai_quality_gate.py --json-out /tmp/current-quality.json
      - name: Run red-team harness
        run: python scripts/run_red_team.py
      - name: Check quality regression baseline
        env:
          PYTHONPATH: aitracker-upload
        run: python scripts/ai_quality_regression.py --current /tmp/current-quality.json --baseline scripts/ai_quality_baseline.json
