name: Frontend CI
# Purchase-aware portfolio analytics are validated in the standard build.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "api/**"
      - "server/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "vercel.json"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - "supabase/**"
      - "src/**"
      - "api/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "vercel.json"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm run security:audit

      - name: Typecheck
        run: npm run lint

      - name: Measurement unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

