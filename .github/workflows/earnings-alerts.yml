name: Earnings Alert Scheduler

on:
  schedule:
    # 08:30 Asia/Kolkata every day.
    - cron: '30 8 * * *'
      timezone: "Asia/Kolkata"
  workflow_dispatch:

concurrency:
  group: earnings-alert-scheduler
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  check-earnings:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::GitHub Actions OIDC token endpoint is unavailable."
            echo "::error::Verify that this job has id-token: write permission."
            exit 1
          fi

          response="$(curl --fail-with-body --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 2 \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --header "Accept: application/json; api-version=2.0" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=ai-infra-watch")"

          token="$(printf '%s' "$response" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          if [ -z "$token" ]; then
            echo "::error::GitHub OIDC token was empty."
            exit 1
          fi
          printf '%s' "$token" > "$RUNNER_TEMP/aiw-oidc-token"

      - name: Run T-1 earnings alert check
        run: |
          set -euo pipefail
          token="$(cat "$RUNNER_TEMP/aiw-oidc-token")"

          curl --fail-with-body --silent --show-error \
            --request GET \
            --header "Authorization: Bearer $token" \
            --header "User-Agent: ai-infra-watch-github-actions/1.0" \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 2 \
            "https://ai-infra-watch-theta.vercel.app/api/earnings-alerts?days=14&notify=1"

      - name: Record completion
        run: echo "Earnings alert check completed at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
