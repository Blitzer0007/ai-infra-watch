name: Refresh SEC Filings Corpus

on:
  push:
    paths:
      - ".github/workflows/sec-filings-refresh.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: sec-filings-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r aitracker-upload/requirements.txt
          python -m pip install -r aitracker-upload/requirements-ingest.txt

      - name: Probe SEC upstream
        env:
          SEC_GATEWAY_URL: https://ai-infra-watch-theta.vercel.app/api/company-scale
          SEC_GATEWAY_TOKEN: ${{ secrets.SEC_GATEWAY_TOKEN }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: |
          set -euo pipefail
          if [ -n "$SEC_CONTACT_EMAIL" ]; then
            UA="AI Infra Watch/1.0 ($SEC_CONTACT_EMAIL)"
          else
            UA="AI Infra Watch/1.0 (SEC research; contact: github-actions[bot]@users.noreply.github.com)"
          fi

          if [ -n "$SEC_GATEWAY_TOKEN" ]; then
            echo "Checking SEC ticker directory through the configured Vercel gateway..."
            curl --fail-with-body --silent --show-error --max-time 20 \
              -H "Authorization: Bearer $SEC_GATEWAY_TOKEN" \
              -o /tmp/company_tickers.json \
              "$SEC_GATEWAY_URL?sec=tickers"
          else
            echo "SEC gateway token is not configured; probing SEC directly..."
            curl --fail-with-body --silent --show-error --max-time 20 \
              -A "$UA" \
              -o /tmp/company_tickers.json \
              "https://www.sec.gov/files/company_tickers.json"
          fi

          CIK=$(python -c 'import json,sys; payload=json.load(open("/tmp/company_tickers.json", encoding="utf-8")); rows=[r for r in payload.values() if str(r.get("ticker","")).upper()=="NVDA"]; print(str(rows[0]["cik_str"]).zfill(10) if rows else sys.exit("NVDA CIK not found"))')

          if [ -n "$SEC_GATEWAY_TOKEN" ]; then
            echo "Checking SEC submissions through the configured Vercel gateway..."
            curl --fail-with-body --silent --show-error --max-time 20 \
              -H "Authorization: Bearer $SEC_GATEWAY_TOKEN" \
              "$SEC_GATEWAY_URL?sec=submissions&cik=$CIK" \
              -o /tmp/sec_submissions.json
          else
            echo "Checking SEC submissions directly..."
            curl --fail-with-body --silent --show-error --max-time 20 \
              -A "$UA" \
              "https://data.sec.gov/submissions/CIK$CIK.json" \
              -o /tmp/sec_submissions.json
          fi

          echo "SEC upstream probe passed."

      - name: Fetch and ingest latest filings
        working-directory: aitracker-upload
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          SEC_GATEWAY_TOKEN: ${{ secrets.SEC_GATEWAY_TOKEN }}
          EDGAR_GATEWAY_URL: https://ai-infra-watch-theta.vercel.app/api/company-scale
        run: |
          set -euo pipefail
          if [ -n "$SEC_CONTACT_EMAIL" ]; then
            UA="AI Infra Watch/1.0 ($SEC_CONTACT_EMAIL)"
          else
            UA="AI Infra Watch/1.0 (SEC research; contact: github-actions[bot]@users.noreply.github.com)"
          fi
          if [ -n "$SEC_GATEWAY_TOKEN" ]; then
            export EDGAR_GATEWAY_TOKEN="$SEC_GATEWAY_TOKEN"
          else
            unset EDGAR_GATEWAY_URL
            unset EDGAR_GATEWAY_TOKEN
          fi
          EDGAR_USER_AGENT="$UA" \
            python scripts/ingest_filings.py --mode live --watchlist

      - name: Export contract intelligence
        working-directory: aitracker-upload
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          SEC_GATEWAY_TOKEN: ${{ secrets.SEC_GATEWAY_TOKEN }}
          EDGAR_GATEWAY_URL: https://ai-infra-watch-theta.vercel.app/api/company-scale
        run: |
          set -euo pipefail
          if [ -n "$SEC_CONTACT_EMAIL" ]; then
            UA="AI Infra Watch/1.0 ($SEC_CONTACT_EMAIL)"
          else
            UA="AI Infra Watch/1.0 (SEC research; contact: github-actions[bot]@users.noreply.github.com)"
          fi
          if [ -n "$SEC_GATEWAY_TOKEN" ]; then
            export EDGAR_GATEWAY_TOKEN="$SEC_GATEWAY_TOKEN"
          else
            unset EDGAR_GATEWAY_URL
            unset EDGAR_GATEWAY_TOKEN
          fi
          EDGAR_USER_AGENT="$UA" \
            python scripts/export_contracts.py --watchlist --output ../data/contracts_sec.json

      - name: Commit corpus changes
        run: |
          set -euo pipefail
          if git diff --quiet -- aitracker-upload/data/filings data/contracts_sec.json; then
            echo "No new SEC filing content."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aitracker-upload/data/filings data/contracts_sec.json
          git commit -m "chore(data): refresh SEC filings corpus"
          git push
