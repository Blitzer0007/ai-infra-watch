name: Refresh SEC Filings Corpus

on:
  schedule:
    # Check EDGAR hourly. The ingest agent deduplicates by accession number,
    # so most runs only perform lightweight metadata checks.
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: sec-filings-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r aitracker-upload/requirements.txt
          python -m pip install -r aitracker-upload/requirements-ingest.txt

      # Prefer a repository secret when configured; otherwise use a descriptive SEC-compliant fallback.

      - name: Probe SEC EDGAR gateway
        env:
          SEC_GATEWAY_URL: https://ai-infra-watch-theta.vercel.app/api/sec-gateway
          SEC_GATEWAY_TOKEN: ${{ secrets.SEC_GATEWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$SEC_GATEWAY_TOKEN" ]; then
            AUTH=(-H "Authorization: Bearer $SEC_GATEWAY_TOKEN")
          else
            AUTH=()
          fi

          echo "Checking Vercel SEC gateway → company ticker endpoint..."
          curl -sS -L --retry 2 --retry-delay 2 "${AUTH[@]}"             -o /tmp/company_tickers.json             -w "gateway tickers HTTP %{http_code}\n"             "$SEC_GATEWAY_URL?resource=tickers"

          CIK=$(python - <<'PY'
import json
with open("/tmp/company_tickers.json", encoding="utf-8") as handle:
    payload = json.load(handle)
for row in payload.values():
    if str(row.get("ticker", "")).upper() == "NVDA":
        print(str(row.get("cik_str", "")).zfill(10))
        break
else:
    raise SystemExit("NVDA CIK not found through SEC gateway")
PY
)

          echo "Checking Vercel SEC gateway → submissions endpoint for CIK $CIK..."
          curl -sS -L --retry 2 --retry-delay 2 "${AUTH[@]}"             -o /tmp/sec_submissions.json             -w "gateway submissions HTTP %{http_code}\n"             "$SEC_GATEWAY_URL?resource=submissions&cik=$CIK"

      - name: Fetch and ingest latest filings
        working-directory: aitracker-upload
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          EDGAR_GATEWAY_URL: https://ai-infra-watch-theta.vercel.app/api/sec-gateway
          EDGAR_GATEWAY_TOKEN: ${{ secrets.SEC_GATEWAY_TOKEN }}
        run: |
          if [ -n "$SEC_CONTACT_EMAIL" ]; then
            UA="AI Infra Watch/1.0 ($SEC_CONTACT_EMAIL)"
          else
            UA="AI Infra Watch/1.0 (SEC research; contact: github-actions[bot]@users.noreply.github.com)"
          fi
          EDGAR_USER_AGENT="$UA" \
            python scripts/ingest_filings.py --mode live --watchlist

      - name: Export contract intelligence
        working-directory: aitracker-upload
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          EDGAR_GATEWAY_URL: https://ai-infra-watch-theta.vercel.app/api/sec-gateway
          EDGAR_GATEWAY_TOKEN: ${{ secrets.SEC_GATEWAY_TOKEN }}
        run: |
          if [ -n "$SEC_CONTACT_EMAIL" ]; then
            UA="AI Infra Watch/1.0 ($SEC_CONTACT_EMAIL)"
          else
            UA="AI Infra Watch/1.0 (SEC research; contact: github-actions[bot]@users.noreply.github.com)"
          fi
          EDGAR_USER_AGENT="$UA" \
            python scripts/export_contracts.py --watchlist --output ../data/contracts_sec.json

      - name: Commit corpus changes
        run: |
          if git diff --quiet -- aitracker-upload/data/filings data/contracts_sec.json; then
            echo "No new SEC filing content."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aitracker-upload/data/filings data/contracts_sec.json
          git commit -m "chore(data): refresh SEC filings corpus"
          git push
